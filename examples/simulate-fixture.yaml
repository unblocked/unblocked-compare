# Context engine simulation — fixture format
#
# Run with: bun run simulate --fixture examples/simulate-fixture.yaml
# CLI flags override fixture values when both are provided.

repo: /path/to/target-repo
branch: main

task: |
  Add a new /health endpoint to the API server that returns
  a JSON object with the service name and current timestamp.

# Optional: acceptance criteria. They become the requirement list the checker
# and judge grade both arms against.
criteria: |
  1. GET /health returns 200 with JSON body
  2. Response includes "service" and "timestamp" fields
  3. Endpoint is registered in the router following existing patterns

# Optional: agent CLI under test, which also runs the simulated engine's
# research (default: claude)
# agent: claude  # claude | codex | cursor

# Optional: models (default: opus for claude, the CLI's default otherwise)
# model: opus
# contextModel: sonnet   # research agent; default: same as model
# judgeModel: fable

# Optional: extra instructions for every research call
# contextInstructions: |
#   Focus on the API routing layer and existing health check patterns.

# Optional: timeouts (seconds): per arm, and per research call
# timeout: 5400
# contextTimeout: 300

# Optional
# review: true         # requirement check and fix rounds
# repeat: 1            # comparisons to run
# keepWorktrees: true
